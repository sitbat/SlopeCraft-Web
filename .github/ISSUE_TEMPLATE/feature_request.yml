name: 功能建议
description: 为 SlopeCraft Web 提出功能或改进建议。
title: "[功能建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [网页项目说明与桌面版差异](https://github.com/sitbat/SlopeCraft-Web#readme) 和 [本仓库已有建议](https://github.com/sitbat/SlopeCraft-Web/issues)。
        原项目的地图画原理和教程见 [SlopeCraft 文档](https://slopecraft.readthedocs.io/)。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述具体使用场景，以及当前操作遇到的不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明希望页面如何工作；可以附草图或具体输入／输出示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充信息（可选）
